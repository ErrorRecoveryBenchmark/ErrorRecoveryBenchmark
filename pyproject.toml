[project]
name = "recoverbench"
version = "1.0.0"
description = "RecoverBench: A Systematic Benchmark for Error Recovery in Robotic Manipulation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21,<2.0",
    "scipy>=1.7",
    "h5py>=3.0",
    "pyyaml>=5.4",
    "tqdm>=4.60",
    "imageio>=2.9",
    "numba>=0.55",
    "mujoco==2.3.2",
    "opencv-python>=4.5",
]

[project.optional-dependencies]
augmentation = [
    "robomimic==0.3.0",
]
collection = [
    "hidapi>=0.10",
    "glfw>=2.0",
]
eval = [
    "torch>=1.12",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/ErrorRecoveryBenchmark/ErrorRecoveryBenchmark"
Dataset = "https://huggingface.co/datasets/ErrorRecovery/ErrorRecoveryBenchmark"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["error_benchmark*"]

[tool.pytest.ini_options]
testpaths = ["error_benchmark/tests"]

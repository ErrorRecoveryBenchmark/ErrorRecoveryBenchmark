# ═══════════════════════════════════════════════════════
# Recovery Demo Collection & Augmentation Configuration
# ═══════════════════════════════════════════════════════

version: "v1.0"

# ─── Recovery Behavior Groups (RBG) ───
# 24 subtypes grouped by recovery motor primitive
recovery_behavior_groups:
  RBG_A:  # Re-grasp
    name: "re_grasp"
    description: "Re-acquire misaligned object → deliver to target"
    subtask_sequence: ["retract", "re_orient", "re_grasp", "re_lift", "re_transport", "re_place"]
    subtypes:
      - "grasp_misalignment_D0"
      - "grasp_misalignment_D1"
      - "grasp_wrong_pose_D0"
      - "grasp_wrong_pose_D1"
    representative: "grasp_misalignment_D0"

  RBG_B:  # Retrieve
    name: "retrieve"
    description: "Re-acquire dropped object → deliver to target"
    subtask_sequence: ["navigate_to_object", "re_grasp", "re_lift", "re_transport", "re_place"]
    subtypes:
      - "drop_in_transit_D0"
      - "drop_in_transit_D1"
      - "drop_at_wrong_place_D0"
      - "drop_at_wrong_place_D1"
    representative: "drop_in_transit_D0"

  RBG_C:  # Retract (collision recovery)
    name: "retract"
    description: "Back away → re-approach target"
    subtask_sequence: ["retract", "navigate_to_object"]
    subtypes:
      - "collision_holding_D0"
      - "collision_holding_D1"
      - "collision_empty_D0"
      - "collision_empty_D1"
      - "collision_eef_object_D0"
      - "collision_eef_object_D1"
      - "collision_self_D0"
      - "collision_self_D1"
    representative: "collision_holding_D0"

  RBG_D:  # Redirect
    name: "redirect"
    description: "Release wrong object → re-acquire correct object → deliver"
    subtask_sequence: ["release", "navigate_to_object", "re_grasp", "re_lift", "re_transport", "re_place"]
    subtypes:
      - "wrong_object_D0"
      - "wrong_object_D1"
    representative: "wrong_object_D0"

  RBG_E:  # Realign
    name: "realign"
    description: "Correct position/trajectory → resume task"
    subtask_sequence: ["correct_position", "resume_task"]
    subtypes:
      - "trajectory_regression_D0"
      - "trajectory_regression_D1"
      - "stuck_no_progress_D0"
      - "stuck_no_progress_D1"
      - "position_error_D0"
      - "position_error_D1"
    representative: "position_error_D0"

# ─── Task tiers and demo allocations ───
task_tiers:
  tier_1:  # Full coverage, most demos
    tasks: ["pick_place", "stack"]
    description: "Primary tasks with full 24-subtype coverage"
  tier_2:  # Core coverage
    tasks: ["coffee", "threading"]
    description: "Tasks with unique recovery behaviors (insertion, threading)"
  tier_3:  # Minimal demos, transfer from tier 1/2
    tasks: ["stack_three", "three_piece_assembly"]
    description: "Multi-stage tasks, recovery transfers from tier 1/2"

# ─── Collection targeting ───
collection:
  mode: "per_scene"  # "per_scene" = one counted demo per error scene; "quota" = legacy subtype quota


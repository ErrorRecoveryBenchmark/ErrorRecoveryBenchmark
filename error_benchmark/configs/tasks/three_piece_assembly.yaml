# ═══════════════════════════════════════════════════════
# Task Configuration: Three Piece Assembly
# ═══════════════════════════════════════════════════════

task_name: "three_piece_assembly"
env_name: "ThreePieceAssembly"
task_description: "Assemble two pieces onto a base: insert piece_1 into base, then piece_2 onto piece_1"

# Environment configuration
env_args:
  env_name: "ThreePieceAssembly"
  robots: ["Panda"]
  gripper_types: "default"
  has_renderer: false
  has_offscreen_renderer: false
  use_camera_obs: false
  use_object_obs: true
  control_freq: 20
  horizon: 1000
  ignore_done: true

# Object configuration
objects:
  - name: "base"
    body_name: "base"
    geom_names: ["base_g0"]
    grasp_geoms: []
    initial_pos_range:
      x: [-0.08, 0.08]
      y: [-0.08, 0.08]
      z: [0.0, 0.0]
  - name: "piece_1"
    body_name: "piece_1"
    geom_names: ["piece_1_g0"]
    grasp_geoms: ["piece_1_g0"]
    initial_pos_range:
      x: [-0.08, 0.08]
      y: [-0.08, 0.08]
      z: [0.0, 0.0]
  - name: "piece_2"
    body_name: "piece_2"
    geom_names: ["piece_2_g0"]
    grasp_geoms: ["piece_2_g0"]
    initial_pos_range:
      x: [-0.08, 0.08]
      y: [-0.08, 0.08]
      z: [0.0, 0.0]

# Target position configuration (assembly location on base)
target:
  pos_range:
    x: [-0.08, 0.08]
    y: [-0.08, 0.08]
    z: [0.80, 0.90]
  radius: 0.02

# Task phase definitions
phases:
  reach: "eef_to_obj_dist <= 0.06"
  grasp: "eef_to_obj_dist <= 0.06 and gripper_closed_norm >= 0.5"
  lift: "object_grasped and object_pos[2] >= 0.84"
  insert_first: "piece_1_on_base"
  transport_second: "object_grasped and piece_2 near piece_1"
  insert_second: "piece_1_on_base and piece_2_on_piece_1"
  done: "insert_second and success"

# Threshold configuration
thresholds:
  reach: 0.06
  grasp_closed: 0.05
  grasp_eef_dist: 0.06
  lift_height: 0.84
  transport: 0.05
  insert_dist: 0.02
  place_height: 0.02
  place_drop_height: 0.05

# Sub-goal weights
completion_weights:
  reach: 0.05
  grasp: 0.1
  lift: 0.1
  insert_first: 0.35
  transport_second: 0.1
  insert_second: 0.3

# Gripper configuration
gripper:
  type: "two_finger"
  open_qpos: [0.04, -0.04]
  close_qpos: [0.0, 0.0]
  grasp_threshold: 0.02

# Controller configuration
controller: "OSC"
action_scale: 1.0

# Workspace limits
workspace:
  x: [-0.6, 0.6]
  y: [-0.6, 0.6]
  z: [0.0, 2.0]

# Physics parameters
physics:
  gravity: -9.81
  timestep: 0.002
  control_freq: 20

# Success criteria
success:
  any_of:
    - condition: "task_success"
      threshold: 1.0

# Failure criteria
failure:
  any_of:
    - condition: "object_dropped"
      threshold: 0.75
    - condition: "timeout"
      max_steps: 1000

recovery_augmentation:
  placement_refs:
    piece_1: base
    piece_2: piece_1

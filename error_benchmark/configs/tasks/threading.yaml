# ═══════════════════════════════════════════════════════
# Task Configuration: Threading
# ═══════════════════════════════════════════════════════

task_name: "threading"
env_name: "Threading"
task_description: "Pick up the needle and thread it through the ring on the tripod"

# Environment configuration
env_args:
  env_name: "Threading"
  robots: ["Panda"]
  gripper_types: "default"
  has_renderer: false
  has_offscreen_renderer: false
  use_camera_obs: false
  use_object_obs: true
  control_freq: 20
  horizon: 1000
  ignore_done: true

# Object configuration
objects:
  - name: "needle"
    body_name: "needle_obj"
    geom_names: ["needle_obj_needle"]
    grasp_geoms: ["needle_obj_needle"]
    initial_pos_range:
      x: [-0.1, 0.1]
      y: [-0.1, 0.1]
      z: [0.0, 0.0]
  - name: "tripod"
    body_name: "tripod_obj"
    geom_names: ["tripod_obj_base_g0"]
    grasp_geoms: []
    initial_pos_range:
      x: [0.1, 0.2]
      y: [0.1, 0.2]
      z: [0.0, 0.0]

# Target position configuration (ring center on tripod)
target:
  pos_range:
    x: [0.1, 0.2]
    y: [0.1, 0.2]
    z: [0.85, 0.95]
  radius: 0.03

# Task phase definitions
phases:
  reach: "eef_to_obj_dist <= 0.06"
  grasp: "eef_to_obj_dist <= 0.06 and gripper_closed_norm >= 0.5"
  lift: "object_grasped and object_pos[2] >= 0.85"
  approach: "object_grasped and needle_near_ring"
  thread: "object_grasped and needle_through_ring"
  done: "thread and success"

# Threshold configuration
thresholds:
  reach: 0.06
  grasp_closed: 0.05
  grasp_eef_dist: 0.06
  lift_height: 0.85
  approach_dist: 0.05
  thread_dist: 0.02
  place_height: 0.02
  place_drop_height: 0.05

# Sub-goal weights
completion_weights:
  reach: 0.1
  grasp: 0.15
  lift: 0.1
  approach: 0.25
  thread: 0.4

# Gripper configuration
gripper:
  type: "two_finger"
  open_qpos: [0.04, -0.04]
  close_qpos: [0.0, 0.0]
  grasp_threshold: 0.02

# Controller configuration
controller: "OSC"
action_scale: 1.0

# Workspace limits
workspace:
  x: [-0.6, 0.6]
  y: [-0.6, 0.6]
  z: [0.0, 2.0]

# Physics parameters
physics:
  gravity: -9.81
  timestep: 0.002
  control_freq: 20

# Success criteria
success:
  any_of:
    - condition: "task_success"
      threshold: 1.0

# Failure criteria
failure:
  any_of:
    - condition: "object_dropped"
      threshold: 0.75
    - condition: "timeout"
      max_steps: 1000

recovery_augmentation:
  placement_refs:
    needle: tripod
